name: PostgreSQL integration

on:
  pull_request:
  push:
    branches:
      - main
      - build/legacy-hub-v1-core

jobs:
  startup-and-workflow:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: legacy_hub_test
          POSTGRES_USER: legacy
          POSTGRES_PASSWORD: legacy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U legacy -d legacy_hub_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://legacy:legacy_test@localhost:5432/legacy_hub_test
      AUTH_SECRET_KEY: integration-test-secret-that-is-not-used-in-production
      ENVIRONMENT: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install application and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'

      - name: Validate migrations against PostgreSQL
        run: alembic upgrade head

      - name: Start Legacy Hub and verify health endpoint
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/legacy-hub.log 2>&1 &
          echo $! > /tmp/legacy-hub.pid
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/legacy-hub.log
          exit 1

      - name: Run PostgreSQL workflow tests
        run: pytest -q tests/integration

      - name: Stop Legacy Hub
        if: always()
        run: |
          if test -f /tmp/legacy-hub.pid; then
            kill "$(cat /tmp/legacy-hub.pid)" 2>/dev/null || true
          fi
