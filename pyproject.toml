[project]
name = "legacy-hub"
version = "0.1.0"
description = "Core orchestration server for Legacy Hub"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16.0,<2.0",
  "fastapi>=0.116.0,<1.0",
  "uvicorn[standard]>=0.35.0,<1.0",
  "sqlalchemy>=2.0.41,<3.0",
  "psycopg[binary]>=3.2.9,<4.0",
  "pydantic-settings>=2.10.0,<3.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.1,<1.0",
  "pytest>=8.4.0,<9.0",
  "ruff>=0.12.0,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
